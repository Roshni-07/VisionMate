services:
  - type: web
    name: visionmate
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    disk:
      name: visionmate-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/visionmate.db
      - key: PYTHON_VERSION
        value: 3.11.0
