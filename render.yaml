services:
  - type: web
    name: visionmate
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DB_PATH
        value: /tmp/visionmate.db
      - key: PYTHON_VERSION
        value: 3.11.0
