<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VisionMate</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #6ee7f7;
    --accent2: #a78bfa;
    --danger: #f87171;
    --success: #4ade80;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 18px;
  }

  /* ── High Contrast Mode ── */
  body.high-contrast {
    --bg: #000000;
    --surface: #111111;
    --border: #ffff00;
    --accent: #ffff00;
    --accent2: #ffff00;
    --danger: #ff4444;
    --success: #00ff00;
    --text: #ffffff;
    --muted: #cccccc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 18px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Login Screen ── */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    width: 100%;
  }
  .logo { font-size: 3rem; margin-bottom: 8px; }
  .brand {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 48px;
    text-align: center;
  }
  .input-group {
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
  }
  .input-group label {
    display: block;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .input-group input {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--text);
    font-size: 1.1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%;
    max-width: 340px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    padding: 20px;
    color: #0a0a0f;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

  /* ── Main App ── */
  #mainApp { display: none; flex-direction: column; width: 100%; max-width: 480px; min-height: 100vh; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .header-title { font-weight: 700; font-size: 1.2rem; }
  .user-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    color: var(--accent);
  }
  .logout-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.4rem;
    padding: 4px 8px;
    min-width: 44px;
    min-height: 44px;
  }

  /* Camera */
  .camera-wrap {
    position: relative;
    width: 100%;
    background: #000;
    overflow: hidden;
  }
  #videoEl {
    width: 100%;
    display: block;
    max-height: 52vw;
    object-fit: cover;
  }
  #canvas { display: none; }
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
  }
  .flash.active { opacity: 0.7; }

  .auto-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(110,231,247,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    display: none;
  }
  .auto-badge.visible { display: block; }

  .flip-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(0,0,0,0.5);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.2s;
    z-index: 5;
  }
  .flip-btn:active { transform: scale(0.9) rotate(180deg); }

  .zoom-wrap {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 68px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.45);
    border-radius: 20px;
    padding: 6px 14px;
    backdrop-filter: blur(4px);
  }
  .zoom-wrap span {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
    min-width: 36px;
    text-align: right;
  }
  .zoom-wrap input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.3);
    outline: none;
    cursor: pointer;
  }
  .zoom-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* Result box */
  .result-box {
    margin: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    min-height: 80px;
    font-size: 1.2rem;
    line-height: 1.6;
    color: var(--text);
    position: relative;
  }
  .result-box.speaking { border-color: var(--accent); }
  .result-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SOS Button ── */
  .sos-wrap {
    padding: 0 16px 12px;
  }
  .sos-btn {
    width: 100%;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    border: none;
    border-radius: var(--radius);
    padding: 22px;
    color: white;
    font-size: 1.4rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: transform 0.1s, opacity 0.2s;
    box-shadow: 0 4px 24px rgba(239,68,68,0.35);
  }
  .sos-btn:active { transform: scale(0.97); opacity: 0.9; }

  /* Action grid */
  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 12px;
  }
  .action-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 12px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    text-align: center;
    min-height: 90px;
  }
  .action-btn:active { transform: scale(0.96); }
  .action-btn .icon { font-size: 2rem; }
  .action-btn.face-btn:hover, .action-btn.face-btn:focus { border-color: var(--accent); }
  .action-btn.ocr-btn:hover, .action-btn.ocr-btn:focus { border-color: #fbbf24; }
  .action-btn.obj-btn:hover, .action-btn.obj-btn:focus { border-color: var(--accent2); }
  .action-btn.reg-btn:hover, .action-btn.reg-btn:focus { border-color: var(--success); }

  /* Controls row */
  .controls-row {
    display: flex;
    gap: 8px;
    padding: 0 16px 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    flex: 1;
    min-width: 70px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: border-color 0.2s;
    min-height: 52px;
  }
  .ctrl-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(110,231,247,0.07);
  }
  .mic-btn.listening {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(248,113,113,0.07);
    animation: pulse-border 1s infinite;
  }
  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(248,113,113,0); }
  }

  /* Register modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 40px;
    width: 100%;
    max-width: 480px;
  }
  .modal h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
  .modal .input-group { max-width: 100%; }
  .modal-btns { display: flex; gap: 12px; margin-top: 20px; }
  .btn-secondary {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
    min-height: 56px;
  }
  .btn-confirm {
    flex: 2;
    background: linear-gradient(135deg, var(--success), #16a34a);
    border: none;
    border-radius: 12px;
    padding: 16px;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    min-height: 56px;
  }

  /* Persons list */
  .persons-section { padding: 0 16px 24px; }
  .persons-section h4 {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .person-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    margin: 4px 4px 4px 0;
    font-size: 0.9rem;
  }
  .person-chip .del { cursor: pointer; color: var(--danger); font-size: 1rem; margin-left: 4px; }

  /* Voice hint */
  .voice-hint {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    padding: 0 16px 16px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="logo">👁️</div>
  <div class="brand">VisionMate</div>
  <div class="tagline">AI assistant for vision &amp; memory</div>
  <div class="input-group">
    <label>Your Name</label>
    <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off" />
  </div>
  <button class="btn-primary" onclick="doLogin()">Get Started</button>
</div>

<!-- ── MAIN APP ── -->
<div id="mainApp">
  <div class="header">
    <div class="header-title">👁️ VisionMate</div>
    <div class="user-badge" id="userBadge"></div>
    <button class="logout-btn" onclick="doLogout()" title="Logout">⏻</button>
  </div>

  <div class="camera-wrap">
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="flash" id="flash"></div>
    <div class="auto-badge" id="autoBadge">⚡ AUTO</div>
    <button class="flip-btn" onclick="flipCamera()" title="Flip camera">🔄</button>
    <div class="zoom-wrap">
      <span>🔍</span>
      <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" oninput="applyZoom(this.value)">
      <span id="zoomLabel">1×</span>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-label">Result</div>
    <div id="resultText">Tap a button below to begin.</div>
  </div>

  <!-- ── SOS BUTTON ── -->
  <div class="sos-wrap">
    <button class="sos-btn" onclick="triggerSOS()">🆘 SOS — Call for Help</button>
  </div>

  <div class="action-grid">
    <button class="action-btn face-btn" onclick="runFace()">
      <span class="icon">🧑‍🤝‍🧑</span>Who is this?
    </button>
    <button class="action-btn ocr-btn" onclick="runOCR()">
      <span class="icon">📖</span>Read Text
    </button>
    <button class="action-btn obj-btn" onclick="runObject()">
      <span class="icon">🔍</span>What is this?
    </button>
    <button class="action-btn reg-btn" onclick="openRegister()">
      <span class="icon">➕</span>Register Face
    </button>
  </div>

  <div class="controls-row">
    <button class="ctrl-btn mic-btn" id="micBtn" onclick="toggleVoice()">🎙️ Voice</button>
    <button class="ctrl-btn" id="autoBtn" onclick="toggleAuto()">⚡ Auto</button>
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">🔊 Sound</button>
    <button class="ctrl-btn" onclick="showPersons()">👥 Memory</button>
    <button class="ctrl-btn" id="contrastBtn" onclick="toggleContrast()">🌓 Contrast</button>
  </div>

  <div class="voice-hint" id="voiceHint" style="display:none">
    Say: <b>"who is this"</b> · <b>"read the text"</b> · <b>"what is this"</b><br>
    Or: <b>"update [name]'s details to [description]"</b>
  </div>

  <div class="persons-section">
    <h4>Registered People</h4>
    <div id="personsList">Loading…</div>
  </div>
</div>

<!-- ── REGISTER MODAL ── -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <h3>➕ Register a Face</h3>
    <div class="input-group">
      <label>Person's Name</label>
      <input type="text" id="regName" placeholder="e.g. Riya" />
    </div>
    <div class="input-group" style="margin-top:14px">
      <label>Description (optional)</label>
      <input type="text" id="regDesc" placeholder="e.g. daughter, wears glasses" />
    </div>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeRegister()">Cancel</button>
      <button class="btn-confirm" onclick="doRegister()">📸 Capture &amp; Register</button>
    </div>
  </div>
</div>

<script>
const SERVER = "https://visionmate-zi3m.onrender.com";
let userId = null, userName = null;
let videoStream = null;
let currentFacing = "environment";
let currentZoom   = 1;
let autoInterval = null;
let isAutoMode   = false;
let recognition  = null;
let isListening  = false;
let isBusy       = false;
let isMuted      = false;
let isHighContrast = false;

// ── Login ──────────────────────────────────────────────────────────────────
async function doLogin() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return alert("Please enter your name.");
  try {
    const res = await fetch(`${SERVER}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const d = await res.json();
    if (d.error) return alert(d.error);
    userId = d.user_id;
    userName = d.name;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "flex";
    document.getElementById("userBadge").textContent = userName;
    startCamera();
    loadPersons();
  } catch (e) {
    alert("Connection failed. Check internet.");
  }
}

function doLogout() {
  stopAuto();
  stopVoice();
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  userId = userName = null;
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
}

document.getElementById("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

// ── High Contrast Toggle ────────────────────────────────────────────────────
function toggleContrast() {
  isHighContrast = !isHighContrast;
  document.body.classList.toggle("high-contrast", isHighContrast);
  const btn = document.getElementById("contrastBtn");
  btn.classList.toggle("active", isHighContrast);
  btn.textContent = isHighContrast ? "🌕 Normal" : "🌓 Contrast";
}

// ── SOS ────────────────────────────────────────────────────────────────────
function triggerSOS() {
  speak("Emergency alert. Sending SOS to caregiver.");
  setResult("🆘 Sending SOS to caregiver…");

  // Log to backend
  if (userId) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = `${pos.coords.latitude},${pos.coords.longitude}`;
        apiPost("/sos", { user_id: userId, location: loc });
        const mapsUrl = `https://maps.google.com/?q=${loc}`;
        const msg = encodeURIComponent(`🆘 EMERGENCY: VisionMate user ${userName} needs help!\nLocation: ${mapsUrl}`);
        window.open(`https://wa.me/?text=${msg}`, "_blank");
      },
      () => {
        // No location — still send SOS
        apiPost("/sos", { user_id: userId, location: "" });
        const msg = encodeURIComponent(`🆘 EMERGENCY: VisionMate user ${userName} needs help!`);
        window.open(`https://wa.me/?text=${msg}`, "_blank");
      }
    );
  } else {
    const msg = encodeURIComponent("🆘 EMERGENCY: VisionMate user needs help!");
    window.open(`https://wa.me/?text=${msg}`, "_blank");
  }
}

// ── Camera ─────────────────────────────────────────────────────────────────
async function startCamera() {
  try {
    if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing, width: { ideal: 1280 } },
      audio: false
    });
    document.getElementById("videoEl").srcObject = videoStream;
  } catch {
    alert("Camera access denied. Please allow camera permission.");
  }
}

async function flipCamera() {
  currentFacing = currentFacing === "environment" ? "user" : "environment";
  currentZoom = 1;
  document.getElementById("zoomSlider").value = 1;
  document.getElementById("zoomLabel").textContent = "1×";
  await startCamera();
}

function applyZoom(val) {
  currentZoom = parseFloat(val);
  document.getElementById("zoomLabel").textContent = currentZoom.toFixed(1) + "×";
  const video = document.getElementById("videoEl");
  if (videoStream) {
    const track = videoStream.getVideoTracks()[0];
    if (track && track.getCapabilities) {
      const caps = track.getCapabilities();
      if (caps.zoom) {
        const min = caps.zoom.min, max = caps.zoom.max;
        const z = Math.min(max, Math.max(min, min + (currentZoom - 1) * (max - min) / 4));
        track.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
        return;
      }
    }
  }
  video.style.transform = `scale(${currentZoom})`;
  video.style.transformOrigin = "center center";
}

function captureFrame() {
  const video  = document.getElementById("videoEl");
  const canvas = document.getElementById("canvas");
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext("2d").drawImage(video, 0, 0);
  return canvas.toDataURL("image/jpeg", 0.8);
}

function doFlash() {
  const f = document.getElementById("flash");
  f.classList.add("active");
  setTimeout(() => f.classList.remove("active"), 150);
}

// ── Result Display ─────────────────────────────────────────────────────────
function setResult(text, loading = false) {
  const box  = document.getElementById("resultBox");
  const div  = document.getElementById("resultText");
  if (loading) {
    div.innerHTML = `<span class="spinner"></span>${text}`;
  } else {
    div.textContent = text;
    box.classList.add("speaking");
    speak(text);
    setTimeout(() => box.classList.remove("speaking"), 3000);
  }
}

function speak(text) {
  if (isMuted || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function toggleMute() {
  isMuted = !isMuted;
  const btn = document.getElementById("muteBtn");
  if (isMuted) {
    window.speechSynthesis.cancel();
    btn.textContent = "🔇 Muted";
    btn.classList.add("active");
  } else {
    btn.textContent = "🔊 Sound";
    btn.classList.remove("active");
  }
}

// ── API Calls ──────────────────────────────────────────────────────────────
async function apiPost(endpoint, body) {
  const res = await fetch(`${SERVER}${endpoint}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return res.json();
}

async function runFace() {
  if (isBusy) return;
  isBusy = true;
  doFlash();
  const image = captureFrame();
  setResult("Identifying faces…", true);
  try {
    // Pass user_id so backend can log the scan
    const d = await apiPost("/face", { user_id: userId, image });
    setResult(d.result || d.error || "No result.");
  } catch { setResult("Network error."); }
  isBusy = false;
}

async function runOCR() {
  if (isBusy) return;
  isBusy = true;
  doFlash();
  const image = captureFrame();
  setResult("Reading text…", true);
  try {
    // Pass user_id so backend can log the scan
    const d = await apiPost("/ocr", { user_id: userId, image });
    setResult(d.result || d.error || "No text found.");
  } catch { setResult("Network error."); }
  isBusy = false;
}

async function runObject() {
  if (isBusy) return;
  isBusy = true;
  doFlash();
  const image = captureFrame();
  setResult("Identifying objects…", true);
  try {
    // Pass user_id so backend can log the scan
    const d = await apiPost("/object", { user_id: userId, image });
    setResult(d.result || d.error || "Could not identify.");
  } catch { setResult("Network error."); }
  isBusy = false;
}

// ── Register ───────────────────────────────────────────────────────────────
function openRegister() {
  document.getElementById("registerModal").classList.add("open");
}
function closeRegister() {
  document.getElementById("registerModal").classList.remove("open");
}

async function doRegister() {
  const name = document.getElementById("regName").value.trim();
  const desc = document.getElementById("regDesc").value.trim();
  if (!name) return alert("Enter a name.");
  doFlash();
  const image = captureFrame();
  closeRegister();
  setResult(`Registering ${name}…`, true);
  try {
    const d = await apiPost("/register", { user_id: userId, name, image, description: desc });
    setResult(d.result || d.error || "Done.");
    loadPersons();
  } catch { setResult("Network error."); }
}

// ── Persons ────────────────────────────────────────────────────────────────
async function loadPersons() {
  try {
    const d = await apiPost("/persons", { user_id: userId });
    const list = document.getElementById("personsList");
    if (!d.persons || d.persons.length === 0) {
      list.textContent = "No people registered yet.";
      return;
    }
    list.innerHTML = d.persons.map(p =>
      `<span class="person-chip">
        🧑 ${p.name}${p.description ? ` — ${p.description}` : ""}
        <span class="del" onclick="forgetPerson('${p.name}')">✕</span>
      </span>`
    ).join("");
  } catch {}
}

async function forgetPerson(name) {
  if (!confirm(`Forget ${name}?`)) return;
  const d = await apiPost("/forget", { user_id: userId, name });
  setResult(d.result || d.error);
  loadPersons();
}

function showPersons() {
  document.querySelector(".persons-section").scrollIntoView({ behavior: "smooth" });
}

// ── Auto Mode ──────────────────────────────────────────────────────────────
function toggleAuto() {
  if (isAutoMode) stopAuto();
  else startAuto();
}

function startAuto() {
  isAutoMode = true;
  document.getElementById("autoBtn").classList.add("active");
  document.getElementById("autoBadge").classList.add("visible");
  autoInterval = setInterval(autoCapture, 10000);
  setResult("Auto mode on. Scanning every 10 seconds.");
}

function stopAuto() {
  isAutoMode = false;
  clearInterval(autoInterval);
  document.getElementById("autoBtn").classList.remove("active");
  document.getElementById("autoBadge").classList.remove("visible");
}

async function autoCapture() {
  if (isBusy) return;
  isBusy = true;
  const image = captureFrame();
  try {
    const d = await apiPost("/face", { user_id: userId, image });
    if (d.count && d.count > 0) {
      doFlash();
      setResult(d.result);
      isBusy = false;
      return;
    }
  } catch {}
  try {
    const d = await apiPost("/object", { user_id: userId, image });
    if (d.tags && d.tags.length > 0) {
      doFlash();
      setResult(d.result);
    }
  } catch {}
  isBusy = false;
}

// ── Voice Commands ─────────────────────────────────────────────────────────
function toggleVoice() {
  if (isListening) stopVoice();
  else startVoice();
}

function startVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Voice not supported on this browser. Use Chrome on Android.");
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous    = true;
  recognition.interimResults = false;
  recognition.lang          = "en-US";
  recognition.onresult = e => {
    const transcript = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
    handleVoiceCommand(transcript);
  };
  recognition.onend = () => { if (isListening) recognition.start(); };
  recognition.onerror = () => stopVoice();
  recognition.start();
  isListening = true;
  document.getElementById("micBtn").classList.add("listening");
  document.getElementById("micBtn").textContent = "🔴 Stop";
  document.getElementById("voiceHint").style.display = "block";
}

function stopVoice() {
  if (recognition) recognition.stop();
  isListening = false;
  document.getElementById("micBtn").classList.remove("listening");
  document.getElementById("micBtn").textContent = "🎙️ Voice";
  document.getElementById("voiceHint").style.display = "none";
}

async function handleVoiceCommand(text) {
  if (text.includes("who is") || text.includes("who are")) {
    runFace();
  } else if (text.includes("read") || text.includes("what does it say")) {
    runOCR();
  } else if (text.includes("what is") || text.includes("what are")) {
    runObject();
  } else if (text.includes("help") || text.includes("emergency") || text.includes("sos")) {
    triggerSOS();
  } else if (text.includes("update") && text.includes("details to")) {
    const match = text.match(/update\s+([\w\s]+?)(?:'s)?\s+details\s+to\s+(.+)/i);
    if (match) {
      const name = match[1].trim();
      const desc = match[2].trim();
      const d = await apiPost("/update_person", { user_id: userId, name, description: desc });
      setResult(d.result || d.error);
      loadPersons();
    }
  }
}
</script>
